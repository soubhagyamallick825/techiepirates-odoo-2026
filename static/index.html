<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Brightloop Subscriptions</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script><script src="https://unpkg.com/lucide@0.469.0"></script>
<style type="text/tailwindcss">.inp{@apply border border-gray-300 rounded px-2 py-1 w-full text-sm bg-white}.btn{@apply bg-[#714B67] text-white rounded px-3 py-1.5 text-sm hover:opacity-90 disabled:opacity-40 inline-block}.btn2{@apply border border-[#714B67] text-[#714B67] rounded px-3 py-1.5 text-sm hover:bg-purple-50 disabled:opacity-40 inline-block}.card{@apply bg-white rounded-lg border p-4}th{@apply text-left text-xs text-gray-500 p-2}td{@apply p-2 border-t text-sm}.db{@apply bg-gray-700 px-2 py-1 rounded hover:bg-gray-600}</style></head>
<body class="bg-gray-100 text-gray-800 pb-8">
<div class="bg-gray-900 text-white text-xs px-3 py-2 flex flex-wrap gap-2 items-center"><b>Demo</b>
<button class=db onclick="demo('admin')">Admin</button><button class=db onclick="demo('staff')">Internal staff</button><button class=db onclick="demo('customer')">Customer portal</button>
<span class="mx-2 text-gray-500">|</span><button class="db !bg-emerald-700" onclick="bill()">Trigger Billing Day</button><button class="db !bg-emerald-700" onclick="seedN()">Seed 2,000 Subscriptions</button><button class=db onclick="inbox()">Email inbox</button></div>
<div id=app></div><div id=modal></div><div id=toasts class="fixed top-14 right-4 z-50 space-y-2"></div>
<footer class="fixed bottom-0 inset-x-0 bg-gray-900 text-gray-300 text-xs px-3 py-1">Query time: <b id=ms>-</b>ms (target under 2000ms)</footer>
<script>
const $=s=>document.querySelector(s),M=n=>(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
let U=null,V='dash',P={},FL={},mode='login';
const NAV={admin:[['dash','Dashboard','layout-dashboard'],['subs','Subscriptions','repeat'],['inv','Invoices','file-text'],['products','Products','package'],['plans','Plans','calendar-clock'],['templates','Quotation templates','file-pen'],['discounts','Discounts','percent'],['taxes','Taxes','landmark'],['staff','Staff','users']],
 staff:[['dash','Dashboard','layout-dashboard'],['subs','Subscriptions','repeat'],['inv','Invoices','file-text'],['products','Products','package'],['plans','Plans','calendar-clock']],
 customer:[['subs','My subscriptions','repeat'],['inv','My invoices','file-text']]};
const F={products:'name,type=Software|Service|Add-on,price#,cost#,notes,attribute,variants',plans:'name,price#,freq=Daily|Weekly|Monthly|Yearly,min_qty#,avail_from@,avail_to@,auto_close?,allow_early_close?,allow_pause?,allow_renew?',taxes:'name,rate#',
 discounts:'name,type=Percentage|Fixed Amount,value#,min_amount#,min_qty#,d_from@,d_to@,max_uses#,scope=Subscription|Product,product_id#',templates:'name,plan_id#,product_id#,variant,qty#,validity_days#'};
const fp=t=>{const o={n:t.replace(/[#@?]$/,'').split('=')[0]};o.k=t.includes('=')?'s':t.endsWith('#')?'number':t.endsWith('@')?'date':t.endsWith('?')?'c':'text';if(o.k=='s')o.o=t.split('=')[1].split('|');return o};
const CL={Draft:'gray',Quotation:'sky',Confirmed:'blue',Active:'green',Paused:'amber',Closed:'slate',Paid:'green',Cancelled:'red',Overdue:'red'};
const B=s=>`<span class="px-2 py-0.5 rounded-full text-xs bg-${CL[s]||'gray'}-100 text-${CL[s]||'gray'}-700">${s}</span>`;
const toast=(m,e)=>{const d=document.createElement('div');d.className='px-4 py-2 rounded shadow text-white text-sm '+(e?'bg-red-600':'bg-emerald-600');d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),5000)};
async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}),ms=r.headers.get('X-Query-Ms'),j=await r.json().catch(()=>({}));if(ms)$('#ms').textContent=ms;if(!r.ok){if(r.status!=401||U)toast(j.error||'Something went wrong',1);throw j}return j}
const modal=h=>{$('#modal').innerHTML=`<div class="fixed inset-0 bg-black/40 flex items-start justify-center overflow-auto p-6 z-40" onclick="if(event.target==this)closeM()"><div class="bg-white rounded-lg p-5 w-full max-w-3xl">${h}</div></div>`},closeM=()=>$('#modal').innerHTML='';
const today=()=>new Date().toISOString().slice(0,10);
const pager=(t,v)=>{const p=P[v]||1,n=Math.ceil(t/25)||1;return `<div class="flex gap-2 items-center justify-end pt-3 text-sm">${t} records, page ${p} of ${n}<button class=btn2 ${p<=1?'disabled':''} onclick="P.${v}=${p}-1;render()">Previous</button><button class=btn2 ${p>=n?'disabled':''} onclick="P.${v}=${p}+1;render()">Next</button></div>`};

async function init(){try{U=await api('me')}catch{U=null}if(U&&!NAV[U.role].some(n=>n[0]==V))V=NAV[U.role][0][0];render()}
function render(){
 if(location.hash.startsWith('#reset=')){$('#app').innerHTML=`<div class="max-w-sm mx-auto mt-10 card space-y-2"><b>Set a new password</b><input id=p class=inp type=password placeholder="New password"><button class=btn onclick="doReset()">Reset password</button></div>`;return}
 if(!U){$('#app').innerHTML=authH(mode);return}
 $('#app').innerHTML=`<div class="flex min-h-[calc(100vh-6rem)]"><aside class="w-52 bg-[#714B67] text-white p-3 space-y-1 shrink-0"><div class="font-bold mb-3 text-lg">Brightloop</div>${NAV[U.role].map(n=>`<a href="#" onclick="V='${n[0]}';render();return false" class="flex gap-2 items-center px-2 py-1.5 rounded ${V==n[0]?'bg-white/20':'hover:bg-white/10'}"><i data-lucide="${n[2]}" class="w-4 h-4"></i>${n[1]}</a>`).join('')}<div class="pt-4 text-xs opacity-80">${U.name}<br>${U.role}<br><a href="#" onclick="logout();return false" class="underline">Log out</a></div></aside><main id=content class="flex-1 p-5 overflow-auto"></main></div>`;
 lucide.createIcons();({dash,subs,inv:invs,staff:staffv}[V]||(()=>cat(V)))().catch(()=>{})}
const authH=m=>`<div class="max-w-sm mx-auto mt-10 card space-y-2"><div class="flex gap-3 text-sm font-medium">${['login','signup','forgot'].map(x=>`<a href="#" class="${m==x?'text-[#714B67] underline':''}" onclick="mode='${x}';render();return false">${{login:'Log in',signup:'Sign up',forgot:'Forgot password'}[x]}</a>`).join('')}</div>${m=='signup'?'<input id=n class=inp placeholder="Name">':''}<input id=e class=inp placeholder=Email type=email>${m!='forgot'?'<input id=p class=inp type=password placeholder="Password (9+ chars, Aa, symbol)">':''}<button class=btn onclick="auth('${m}')">${m=='forgot'?'Send reset link':m=='signup'?'Create account':'Log in'}</button><p class="text-xs text-gray-500">Demo password: Demo@12345 for admin@, staff@ and customer@brightloop.com</p></div>`;
async function auth(m){const b={email:$('#e').value,password:$('#p')?.value,name:$('#n')?.value};if(m=='forgot'){await api('forgot','POST',b);toast('If that email is registered, a reset link is waiting in the Email inbox (top bar)');return}await api(m,'POST',b);init()}
async function doReset(){await api('reset','POST',{token:location.hash.slice(7),password:$('#p').value});location.hash='';toast('Password updated. Log in with the new password');mode='login';init()}
const demo=async r=>{await api('demo/'+r,'POST');V=NAV[r][0][0];init()},logout=async()=>{await api('logout','POST');init()};
async function ensure(){if(!U||U.role=='customer'){await api('demo/staff','POST');V='dash';await init()}}
async function bill(){await ensure();const r=await api('billing/run','POST');toast(`Generated ${r.generated} invoices, skipped ${r.skipped} already-billed subscriptions, auto-applied ${r.discounts} discounts`);render()}
async function seedN(){await ensure();const r=await api('seed','POST',{n:2000});toast(`Added ${r.added} subscriptions`);render()}
async function inbox(){const r=await api('inbox');modal(`<div class="flex justify-between"><h3 class="font-bold mb-2">Simulated email inbox</h3><button onclick=closeM()>✕</button></div>${r.map(m=>`<div class="border-t py-2 text-sm"><b>${m.subject}</b> to ${m.to_email}<div>${m.body.replace(/(\/#reset=\S+)/,'<a class="text-blue-600 underline" href="$1" onclick="closeM()">Open reset link</a>')}</div></div>`).join('')||'No emails yet'}`)}

async function dash(){
 const pl=await api('cat/plans'),d=await api('dashboard?'+new URLSearchParams(Object.fromEntries(Object.entries(FL).filter(e=>e[1]&&['plan_id','freq','status','frm','to'].includes(e[0]))))),
 f=(k,l,o)=>`<select class=inp onchange="FL.${k}=this.value;render()"><option value="">${l}</option>${o.map(x=>`<option value="${x[0]}" ${FL[k]==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`,
 dt=(k)=>`<input type=date class=inp value="${FL[k]||''}" onchange="FL.${k}=this.value;render()">`;
 $('#content').innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-5 gap-2 mb-3">${f('plan_id','All plans',pl.map(p=>[p.id,p.name]))}${f('freq','All frequencies',['Daily','Weekly','Monthly','Yearly'].map(x=>[x,x]))}${f('status','All invoice statuses',['Draft','Confirmed','Paid','Cancelled','Overdue'].map(x=>[x,x]))}${dt('frm')}${dt('to')}</div>
 <div class="grid grid-cols-2 lg:grid-cols-6 gap-3 mb-4">${[['Active subscriptions',d.active],['MRR',M(d.mrr)],['ARR',M(d.arr)],['Revenue collected',M(d.rev)],['Receivables',M(d.owed)],['Overdue invoices',d.od]].map(k=>`<div class=card><div class="text-xs text-gray-500">${k[0]}</div><div class="text-xl font-semibold text-[#714B67]">${k[1]}</div></div>`).join('')}</div>
 <div class="grid lg:grid-cols-3 gap-3"><div class="card lg:col-span-2"><canvas id=c1></canvas></div><div class=card><canvas id=c2></canvas></div></div>`;
 new Chart($('#c1'),{type:'bar',data:{labels:d.chart.map(x=>x.m),datasets:[{label:'Billed',data:d.chart.map(x=>x.billed),backgroundColor:'#d4c2cf'},{label:'Collected',data:d.chart.map(x=>x.paid),backgroundColor:'#714B67'}]}});
 new Chart($('#c2'),{type:'doughnut',data:{labels:d.status.map(x=>x.st),datasets:[{data:d.status.map(x=>x.n)}]}})}

async function subs(){const r=await api(`subs?page=${P.subs||1}&status=${FL.ss||''}`),s=U.role!='customer';
 $('#content').innerHTML=`<div class="flex justify-between mb-3"><select class=inp style="width:auto" onchange="FL.ss=this.value;P.subs=1;render()"><option value="">All statuses</option>${['Draft','Quotation','Confirmed','Active','Paused','Closed'].map(x=>`<option ${FL.ss==x?'selected':''}>${x}</option>`).join('')}</select>${s?'<button class=btn onclick="newSub()">New subscription</button>':''}</div><div class=card><table class=w-full><tr><th>Number<th>Customer<th>Plan<th>Next billing<th>Expiry<th>Amount<th>Status</tr>${r.rows.map(x=>`<tr class="cursor-pointer hover:bg-gray-50" onclick="sdet(${x.id})"><td>${x.number}<td>${x.cust}<td>${x.plan}<td>${x.next_billing}<td>${x.expiry}<td>${M(x.amount)}<td>${B(x.status)}</tr>`).join('')}</table>${pager(r.total,'subs')}</div>`}
async function sdet(i){const s=await api('subs/'+i),st=U.role!='customer',R=['Draft','Quotation','Confirmed','Active','Closed'],cu=s.status=='Paused'?'Active':s.status,sub=s.lines.reduce((a,l)=>a+l.amount,0),tax=sub*(s.rate||0)/100;
 const A=[['quote','Send quotation',['Draft'],1],['confirm','Confirm',['Quotation'],1],['activate','Activate',['Confirmed'],1],['pause','Pause',['Active'],0,'allow_pause'],['resume','Resume',['Paused'],0],['close','Close early',['Active','Paused'],0,'ec'],['renew','Renew',['Active'],0,'allow_renew']].filter(a=>a[2].includes(s.status)&&(st||!a[3])&&(!a[4]||s[a[4]]));
 modal(`<div class="flex justify-between"><h3 class="text-lg font-bold">${s.number}, ${s.cust}</h3><button onclick=closeM()>✕</button></div>
 <div class="flex my-3 text-xs items-center">${R.map(x=>`<div class="px-5 py-1.5 ${x==cu?'bg-[#714B67] text-white':R.indexOf(x)<R.indexOf(cu)?'bg-purple-100':'bg-gray-100'}" style="clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%)">${x}</div>`).join('')}<span class=ml-2>${s.status=='Paused'?B('Paused'):''}</span></div>
 <p class="text-sm">${s.plan} (${s.freq}). Starts ${s.start_date}, expires ${s.expiry}, next billing ${s.next_billing}, terms ${s.terms}${s.valid_until?', quote valid until '+s.valid_until:''}</p>
 <table class="w-full my-2"><tr><th>Product<th>Qty<th>Unit price<th>Amount</tr>${s.lines.map(l=>`<tr><td>${l.name}${l.variant?' ('+l.variant+')':''}<td>${l.qty}<td>${M(l.unit_price)}<td>${M(l.amount)}</tr>`).join('')}</table>
 <p class="text-right text-sm">Subtotal ${M(sub)}, tax ${M(tax)} (${s.rate||0}%), <b>total ${M(sub+tax)}</b></p>
 <div class="my-2 text-sm"><b>Add-ons:</b> ${s.addons.map(a=>`<label class="mr-3"><input type=checkbox ${s.lines.some(l=>l.product_id==a.id)?'checked':''} onchange="addon(${i},${a.id},this.checked)"> ${a.name} (${M(a.price)})</label>`).join('')}</div>
 <div class="flex gap-2 my-3">${A.map(a=>`<button class=btn onclick="act(${i},'${a[0]}')">${a[1]}</button>`).join('')}</div>
 <b class="text-sm">Invoices</b><table class=w-full>${s.invoices.map(v=>`<tr class="cursor-pointer" onclick="idet(${v.id})"><td>${v.number}<td>Due ${v.due_date}<td>${M(v.total)}<td>${B(v.status)}</tr>`).join('')||'<tr><td>No invoices yet</tr>'}</table>`)}
const act=async(i,a)=>{await api(`subs/${i}/${a}`,'POST');toast('Subscription updated');sdet(i);render()},addon=async(i,p,on)=>{await api(`subs/${i}/addon`,'POST',{product_id:p,on});sdet(i)};
async function newSub(){const [u,pl,pr,t,tx]=await Promise.all([api('users'),api('cat/plans'),api('cat/products'),api('cat/templates'),api('cat/taxes')]),o=(a,f)=>a.map(x=>`<option value=${x.id}>${f(x)}</option>`).join('');
 modal(`<h3 class=font-bold>New subscription</h3><div class="grid grid-cols-2 gap-2 text-sm mt-2"><label>Customer<select id=s_c class=inp>${o(u.filter(x=>x.role=='customer'),x=>x.name)}</select></label><label>Start from quotation template<select id=s_t class=inp><option value="">None (manual)</option>${o(t,x=>`${x.name}, valid ${x.validity_days} days`)}</select></label><label>Plan<select id=s_p class=inp>${o(pl,x=>`${x.name}, min qty ${x.min_qty}`)}</select></label><label>Product<select id=s_r class=inp>${o(pr.filter(x=>x.type!='Add-on'),x=>`${x.name} (${M(x.price)})`)}</select></label><label>Variant<input id=s_v class=inp placeholder="e.g. Odoo adds 560"></label><label>Quantity<input id=s_q type=number value=1 class=inp></label><label>Start date<input id=s_d type=date value="${today()}" class=inp></label><label>Tax<select id=s_x class=inp>${o(tx,x=>x.name)}</select></label><label>Payment terms<input id=s_m class=inp value="Net 15"></label></div><button class="btn mt-3" onclick="mkSub()">Create subscription</button>`)}
async function mkSub(){await api('subs','POST',{customer_id:+$('#s_c').value,template_id:$('#s_t').value||null,plan_id:+$('#s_p').value,start_date:$('#s_d').value,tax_id:+$('#s_x').value,terms:$('#s_m').value,lines:[{product_id:+$('#s_r').value,variant:$('#s_v').value,qty:+$('#s_q').value}]});closeM();toast('Subscription created');render()}

async function invs(){const r=await api(`invoices?page=${P.inv||1}&status=${FL.is||''}`),s=U.role!='customer';
 $('#content').innerHTML=`<div class="flex justify-between mb-3"><select class=inp style="width:auto" onchange="FL.is=this.value;P.inv=1;render()"><option value="">All statuses</option>${['Draft','Confirmed','Paid','Cancelled','Overdue'].map(x=>`<option ${FL.is==x?'selected':''}>${x}</option>`).join('')}</select>${s?'<button class=btn2 onclick="confAll()">Confirm all drafts</button>':''}</div><div class=card><table class=w-full><tr><th>Invoice<th>Customer<th>Issued<th>Due<th>Total<th>Paid<th>Status</tr>${r.rows.map(x=>`<tr class="cursor-pointer hover:bg-gray-50" onclick="idet(${x.id})"><td>${x.number}<td>${x.cust}<td>${x.issue_date}<td>${x.due_date}<td>${M(x.total)}<td>${M(x.paid)}<td>${B(x.st)}</tr>`).join('')}</table>${pager(r.total,'inv')}</div>`}
const confAll=async()=>{await api('invoices/confirm_all','POST');toast('Draft invoices confirmed');render()};
async function idet(i){const v=await api('invoices/'+i),s=U.role!='customer',bal=v.total-v.paid;
 modal(`<div class="flex justify-between"><h3 class="text-lg font-bold">${v.number} ${B(v.st)}</h3><button onclick=closeM()>✕</button></div><p class="text-sm">${v.cust}. Issued ${v.issue_date}, due ${v.due_date}, period ${v.ps} to ${v.pe}</p>
 <table class="w-full my-2"><tr><th>Item<th>Qty<th>Unit price<th>Amount</tr>${v.lines.map(l=>`<tr><td>${l.descr}<td>${l.qty}<td>${M(l.unit_price)}<td>${M(l.amount)}</tr>`).join('')}</table>
 <p class="text-right text-sm">Subtotal ${M(v.subtotal)}, discount -${M(v.discount)}, tax ${M(v.tax)}<br><b>Total ${M(v.total)}</b>, paid ${M(v.paid)}, balance <b>${M(bal)}</b></p>
 ${v.payments.length?`<b class="text-sm">Payments</b>${v.payments.map(p=>`<div class="text-sm">${p.date}, ${p.method}, ${M(p.amount)} ${p.note||''}</div>`).join('')}`:''}
 <div class="flex gap-2 my-3 flex-wrap">${s&&v.status=='Draft'?`<button class=btn onclick="ia(${i},'confirm')">Confirm</button>`:''}${s&&['Draft','Confirmed'].includes(v.status)&&!v.paid?`<button class=btn2 onclick="ia(${i},'cancel')">Cancel invoice</button>`:''}${s?`<button class=btn2 onclick="ia(${i},'send')">Send email</button>`:''}<a class=btn2 target=_blank href="/invoice/${i}/print">Print / download PDF</a></div>
 ${s&&v.status=='Confirmed'?`<div class="grid grid-cols-5 gap-2 text-sm"><select id=pm class=inp>${['Bank Transfer','UPI','Card','Cash'].map(x=>`<option>${x}</option>`).join('')}</select><input id=pa class=inp type=number step=0.01 value="${bal.toFixed(2)}"><input id=pd class=inp type=date value="${today()}"><input id=pn class=inp placeholder="Reference note"><button class=btn onclick="pay(${i})">Record payment</button></div>`:''}`)}
const ia=async(i,a)=>{await api(`invoices/${i}/${a}`,'POST');toast(a=='send'?'Email sent. See the Email inbox':'Invoice updated');idet(i);render()},
pay=async i=>{await api(`invoices/${i}/pay`,'POST',{method:$('#pm').value,amount:+$('#pa').value,date:$('#pd').value,note:$('#pn').value});toast('Payment recorded');idet(i);render()};

async function cat(t){const r=await api('cat/'+t),f=F[t].split(',').map(fp);
 $('#content').innerHTML=`<div class="flex justify-between mb-3"><h2 class="text-lg font-bold capitalize">${t}</h2>${U.role=='admin'?`<button class=btn onclick="nf('${t}')">New ${t.replace(/s$/,'')}</button>`:''}</div><div class="card overflow-auto"><table class=w-full><tr>${f.map(x=>`<th>${x.n}`).join('')}</tr>${r.map(x=>`<tr>${f.map(c=>`<td>${c.k=='c'?(x[c.n]?'Yes':'No'):x[c.n]??''}`).join('')}</tr>`).join('')}</table></div>`}
const nf=t=>modal(`<h3 class="font-bold capitalize">New ${t.replace(/s$/,'')}</h3>${F[t].split(',').map(fp).map(f=>`<label class="block text-sm mt-2">${f.n}${f.k=='s'?`<select id=f_${f.n} class=inp>${f.o.map(o=>`<option>${o}</option>`).join('')}</select>`:f.k=='c'?`<input id=f_${f.n} type=checkbox class=ml-2>`:`<input id=f_${f.n} type=${f.k} class=inp>`}</label>`).join('')}<button class="btn mt-3" onclick="sv('${t}')">Save</button>`);
async function sv(t){const b={};F[t].split(',').map(fp).forEach(f=>{const e=$('#f_'+f.n);b[f.n]=f.k=='c'?+e.checked:f.k=='number'?(e.value===''?null:+e.value):e.value});await api('cat/'+t,'POST',b);closeM();toast('Saved');render()}
async function staffv(){const u=(await api('users')).filter(x=>x.role=='staff');
 $('#content').innerHTML=`<div class=card><h2 class="font-bold mb-2">Add internal staff (admin only)</h2><div class="grid grid-cols-4 gap-2"><input id=sn class=inp placeholder=Name><input id=se class=inp placeholder=Email><input id=sp class=inp type=password placeholder=Password><button class=btn onclick="addStaff()">Create staff account</button></div><table class="w-full mt-3">${u.map(x=>`<tr><td>${x.name}<td>${x.email}</tr>`).join('')}</table></div>`}
const addStaff=async()=>{await api('staff','POST',{name:$('#sn').value,email:$('#se').value,password:$('#sp').value});toast('Staff account created');render()};
onhashchange=render;init();
</script></body></html>
